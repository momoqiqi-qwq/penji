  <!-- 右叶 -->
  <path d="M60 75 Q85 65 90 45 Q70 60 60 75 Z" fill="#35A06A" stroke="#0E3B26" stroke-width="1.2"/>
  <path d="M60 75 Q78 62 84 48" stroke="#0E3B26" stroke-width="0.8" fill="none"/>
  <!-- 顶部嫩芽 -->
  <ellipse cx="60" cy="48" rx="6" ry="10" fill="#C8E96B" stroke="#35A06A" stroke-width="1" transform="rotate(-10 60 48)"/>
  <!-- 泥土 -->
