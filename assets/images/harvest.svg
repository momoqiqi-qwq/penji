<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="wheat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C76B"/>
      <stop offset="100%" stop-color="#B4802F"/>
    </linearGradient>
  </defs>
  <!-- 麦秆 -->
  <path d="M100 180 L100 70" stroke="#8B6914" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 70 L100 40" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- 麦穗颗粒（左右交替） -->
  <g fill="url(#wheat)">
    <ellipse cx="88" cy="55" rx="10" ry="6" transform="rotate(-30 88 55)"/>
    <ellipse cx="112" cy="55" rx="10" ry="6" transform="rotate(30 112 55)"/>
    <ellipse cx="86" cy="72" rx="11" ry="6.5" transform="rotate(-30 86 72)"/>
    <ellipse cx="114" cy="72" rx="11" ry="6.5" transform="rotate(30 114 72)"/>
    <ellipse cx="85" cy="90" rx="11.5" ry="7" transform="rotate(-30 85 90)"/>
    <ellipse cx="115" cy="90" rx="11.5" ry="7" transform="rotate(30 115 90)"/>
    <ellipse cx="86" cy="108" rx="11" ry="6.5" transform="rotate(-30 86 108)"/>
    <ellipse cx="114" cy="108" rx="11" ry="6.5" transform="rotate(30 114 108)"/>
    <ellipse cx="88" cy="126" rx="10" ry="6" transform="rotate(-30 88 126)"/>
    <ellipse cx="112" cy="126" rx="10" ry="6" transform="rotate(30 112 126)"/>
  </g>
  <!-- 顶部麦芒 -->
  <g stroke="#C8A04A" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="40" x2="92" y2="22"/>
    <line x1="100" y1="40" x2="100" y2="18"/>
    <line x1="100" y1="40" x2="108" y2="22"/>
  </g>
  <!-- 叶子 -->
  <path d="M100 130 Q70 120 60 100 Q80 122 100 130 Z" fill="#35A06A" opacity="0.7"/>
  <path d="M100 145 Q130 135 140 115 Q120 137 100 145 Z" fill="#2E8A5C" opacity="0.7"/>
</svg>
